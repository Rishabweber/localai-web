          "@type": "WebSite",
          "@id": "https://localweb.ai.studio/#website",

            "priceCurrency": "USD"

            "Printable shop counter QR code generation",

            "Automated local SEO metadata"
          ]
        },
        {
          "@type": "FAQPage",
          "@id": "https://localweb.ai.studio/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Do I need any technical, coding, or design skills to use LocalAI Web?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "None at all! You simply provide basic details like your business name, services, and city. Our AI automatically handles the copywriting, mobile layout, color schemes, SEO meta tags, and contact buttons."
              }
            },
            {
              "@type": "Question",
              "name": "How do customers contact me from the generated website?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Your website includes prominent, sticky 'Chat on WhatsApp' and 'Call Us' buttons. When a visitor taps WhatsApp, it opens a direct chat with your business containing a pre-filled service inquiry message."
              }
            },
            {
              "@type": "Question",
              "name": "Can I edit the text, prices, and services after AI generates the site?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes, 100%! You have full control. You can edit any headline, modify prices, add or remove services, tweak your business hours, or use AI to regenerate individual sections with one click."
              }
            },
            {
              "@type": "Question",
              "name": "Can I share the link with customers on Google Maps and Instagram?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Absolutely. Once you click 'Publish', you get a clean, shareable website link and a ready-to-print QR Code you can put on your shop counter, billing desk, Google Business profile, or social media bio."
              }
            },
            {
              "@type": "Question",
              "name": "Does the website work smoothly on budget smartphones and slow mobile networks?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Every website is built mobile-first and optimized for extreme speed and low data usage, ensuring snappy loading even on 3G/4G connections anywhere in India and worldwide."
              }
            }
          ]
